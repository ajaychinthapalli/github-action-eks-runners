name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  TERRAFORM_VERSION: 1.5.0

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          oidc-provider-arn: ${{ secrets.AWS_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        id: fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        working-directory: ./terraform
        run: terraform init
                    continue-on-error: true

                  - name: Terraform Validate
                    id: validate
                    working-directory: ./terraform
                    run: terraform validate
                    continue-on-error: true

                  - name: Terraform Plan
                    id: plan
                    working-directory: ./terraform
                    run: |
                      terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
                      echo "exit_code=$?" >> $GITHUB_OUTPUT
                    continue-on-error: true

                  - name: Extract and Format Plan Output
                    id: plan_output
                    if: always()
                    working-directory: ./terraform
                    run: |
                      # Extract the plan summary (last 50 lines usually contain the summary)
                      if [ -f plan.txt ]; then
                        PLAN_OUTPUT=$(tail -n 50 plan.txt)
                      else
                        PLAN_OUTPUT="Plan output not available"
                      fi
          
                      # Escape newlines for GitHub Actions
                      PLAN_OUTPUT="${PLAN_OUTPUT//'%'/'%25'}"
                      PLAN_OUTPUT="${PLAN_OUTPUT//$'\n'/'%0A'}"
                      PLAN_OUTPUT="${PLAN_OUTPUT//$'\r'/'%0D'}"
          
                      echo "plan_text=$PLAN_OUTPUT" >> $GITHUB_OUTPUT

                  - name: Comment Plan on PR
                    if: github.event_name == 'pull_request' && always()
                    uses: actions/github-script@v7
                    with:
                      script: |
                        const fmt_status = "${{ steps.fmt.outcome }}" === "success" ? "✅" : "⚠️";
                        const init_status = "${{ steps.init.outcome }}" === "success" ? "✅" : "❌";
                        const validate_status = "${{ steps.validate.outcome }}" === "success" ? "✅" : "❌";
                        const plan_status = "${{ steps.plan.outcome }}" === "success" ? "✅" : "⚠️";
            
                        const plan_output = `${{ steps.plan_output.outputs.plan_text }}`.substring(0, 60000);
            
                        const comment = `## Terraform Plan Report
            
            | Check | Status |
            |-------|--------|
            | Format | ${fmt_status} |
            | Init | ${init_status} |
            | Validate | ${validate_status} |
            | Plan | ${plan_status} |

            ### Plan Output
            \`\`\`
            ${plan_output || 'Plan output not available'}
            \`\`\`

            **Actions Required:**
            - Review the plan output above for any unexpected changes
            - Ensure all resource changes are intentional before merge
            - Run \`terraform apply\` after merge to apply the changes`;
            
                        github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: comment
                        });

                  - name: Save Plan Artifact
                    if: always()
                    uses: actions/upload-artifact@v4
                    with:
                      name: terraform-plan
                      path: terraform/tfplan
                      retention-days: 5
                      if-no-files-found: ignore

                  - name: Save Plan Output Artifact
                    if: always()
                    uses: actions/upload-artifact@v4
                    with:
                      name: terraform-plan-output
                      path: terraform/plan.txt
                      retention-days: 5
                      if-no-files-found: ignore

